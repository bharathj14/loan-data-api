spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      ddl-auto: validate

# AlloyDB connection — requires env vars at runtime
app:
  datasource:
    alloydb:
      instance-uri: ${ALLOYDB_INSTANCE_URI}
      database: ${ALLOYDB_DB_NAME}
      iam-user: ${ALLOYDB_IAM_USER}
      ip-type: ${ALLOYDB_IP_TYPE:PRIVATE}
  downstream:
    base-url: ${DOWNSTREAM_BASE_URL}

springdoc:
  swagger-ui:
    # Disable Swagger UI in production; spec is still accessible for tooling if needed
    enabled: false
  api-docs:
    enabled: false

# ── Security (gcp profile) ────────────────────────────────────────────────────
# Required env vars for OAuth2 JWT Resource Server:
#   OAUTH2_ISSUER_URI  — OIDC issuer URL (e.g. https://accounts.google.com)
#   OAUTH2_AUDIENCE    — expected audience claim (e.g. https://loan-data-api.example.com)
# Both are injected via @Value in SecurityConfig; no spring.security.oauth2 YAML block needed.
