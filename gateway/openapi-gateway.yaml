openapi: "3.0.3"
info:
  title: Loan Data API
  version: "1.0.0"
  description: |
    Read-only REST API exposing loan details from Cloud Bigtable and customer
    relationship accounts from AlloyDB. Deployed on Cloud Run behind GCP API Gateway.

# Replace this with the actual Cloud Run service URL after deployment.
# See README.md § "Cloud Run + API Gateway deployment".
x-google-backend:
  address: https://loan-data-api-HASH-uc.a.run.app
  deadline: 14.0

x-google-management:
  metrics:
    - name: read-requests
      displayName: Read requests
      valueType: INT64
      metricKind: DELTA
  quota:
    limits:
      - name: read-requests-per-minute
        metric: read-requests
        unit: "1/min/{project}"
        values:
          STANDARD: 600

security:
  - ApiKeyAuth: []

paths:
  /api/v1/loans/{loanNumber}:
    get:
      operationId: getLoanDetail
      summary: Get loan details
      description: >
        Returns full loan details for a single loan number read from Cloud Bigtable.
        The loan number must be 6–20 alphanumeric characters.
      parameters:
        - name: loanNumber
          in: path
          required: true
          description: Alphanumeric loan number, 6–20 characters.
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{6,20}$'
            example: LN100042
      responses:
        "200":
          description: Loan found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanDetailResponse'
        "400":
          description: Invalid loan number format
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Loan not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "503":
          description: Cloud Bigtable unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-google-quota:
        metricCosts:
          read-requests: 1

  /api/v1/customers/{customerId}/relationship-accounts:
    get:
      operationId: getRelationshipAccounts
      summary: List relationship accounts for a customer
      description: >
        Returns paginated accounts linked to the customer in AlloyDB.
        When includeLoanDetails=true, LOAN-type accounts on the current page are
        enriched with a summary fetched from Cloud Bigtable in parallel.
        If any Bigtable fetch fails the entire request returns 503.
      parameters:
        - name: customerId
          in: path
          required: true
          description: Customer ID.
          schema:
            type: string
            example: CUST-0042
        - name: relationshipType
          in: query
          required: false
          description: Filter by relationship type.
          schema:
            type: string
            enum: [PRIMARY, JOINT, CO_BORROWER, GUARANTOR, AUTHORIZED_USER]
        - name: includeLoanDetails
          in: query
          required: false
          description: Attach Bigtable loan summary to LOAN accounts.
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size (1–100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Accounts found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipAccountsResponse'
        "400":
          description: Invalid request parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Customer not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "503":
          description: Cloud Bigtable or AlloyDB unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-google-quota:
        metricCosts:
          read-requests: 1

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    LoanDetailResponse:
      type: object
      description: Full details of a single loan from Cloud Bigtable.
      properties:
        loanNumber:
          type: string
          example: LN100001
        productType:
          type: string
          example: PERSONAL_LOAN
        status:
          type: string
          example: ACTIVE
        principalAmount:
          type: number
          format: decimal
          example: 10000.00
        outstandingBalance:
          type: number
          format: decimal
          example: 8500.00
        interestRate:
          type: number
          format: decimal
          example: 5.25
        currency:
          type: string
          example: USD
        originationDate:
          type: string
          format: date
          example: "2022-01-15"
        maturityDate:
          type: string
          format: date
          example: "2027-01-15"
        nextPaymentDueDate:
          type: string
          format: date
          example: "2024-02-01"
        nextPaymentAmount:
          type: number
          format: decimal
          example: 250.00
        borrowerCustomerId:
          type: string
          example: CUST-0001

    LoanSummaryDto:
      type: object
      description: Concise loan summary attached to relationship accounts.
      properties:
        loanNumber:
          type: string
        productType:
          type: string
        status:
          type: string
        outstandingBalance:
          type: number
          format: decimal
        currency:
          type: string

    AccountDto:
      type: object
      description: One account in the customer's relationship portfolio.
      properties:
        accountNumber:
          type: string
          example: LN100001
        accountType:
          type: string
          enum: [LOAN, DEPOSIT, CREDIT_CARD]
        productCode:
          type: string
          example: PERSONAL_LOAN
        status:
          type: string
          example: ACTIVE
        openedDate:
          type: string
          format: date
          example: "2022-01-15"
        currency:
          type: string
          example: USD
        relationshipType:
          type: string
          enum: [PRIMARY, JOINT, CO_BORROWER, GUARANTOR, AUTHORIZED_USER]
        loanDetails:
          $ref: '#/components/schemas/LoanSummaryDto'
          nullable: true

    PageMeta:
      type: object
      properties:
        number:
          type: integer
          description: Zero-based page number.
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    RelationshipAccountsResponse:
      type: object
      properties:
        customerId:
          type: string
          example: CUST-0001
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountDto'
        page:
          $ref: '#/components/schemas/PageMeta'

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail.
      properties:
        type:
          type: string
          format: uri
          example: urn:problem:loan-not-found
        title:
          type: string
          example: Loan Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: The requested loan number does not exist.
        instance:
          type: string
          format: uri
          nullable: true
